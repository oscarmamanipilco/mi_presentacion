<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio | Presentación</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-circles">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <main class="card">
        <header>
            <div class="profile-img">
                <img src="https://via.placeholder.com/150" alt="Foto de perfil">
            </div>
            <h1>Tu Nombre Aquí</h1>
            <p class="tagline">Desarrollador de Software & Arquitecto de Soluciones</p>
        </header>

        <section class="content">
            <p>Especialista en crear sistemas logísticos eficientes y arquitecturas escalables. Enfocado en transformar lógica de negocio compleja en experiencias digitales fluidas.</p>
        </section>

        <nav class="links">
            <a href="#" class="btn primary">Ver Proyectos</a>
            <a href="#" class="btn secondary">Contactar</a>
        </nav>

        <footer>
            <div class="social-icons">
                <a href="#">GitHub</a>
                <a href="#">LinkedIn</a>
                <a href="#">Twitter</a>
            </div>
        </footer>
    </main>
</body>
</html>
